<style>

.storyline{border-left:3px solid #c8cdd2;padding:8px 13px;color:#46505a;margin:0 0 14px}.panel{border:1px solid var(--line);border-radius:7px;padding:15px 16px;margin:12px 0;background:#fff}.panel.soft{background:var(--soft)}.panel.accent{background:var(--accentSoft);border-color:#d8e5ed}.panel-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#67717b;font-weight:750;margin-bottom:8px}
.kc{border:1px solid var(--kcLine);background:var(--kc);border-radius:10px;padding:15px 16px;margin:12px 0}.kc-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#745e23;font-weight:800;margin-bottom:9px}.kc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.kc-part{background:rgba(255,255,255,.72);border:1px solid #e5dbc2;border-radius:7px;padding:11px 12px}.kc-part b{display:block;font-size:12px;margin-bottom:4px}.kc-part p{margin:0;font-size:13px}.kc-formal{margin-top:11px;background:#fffdfa;border:1px solid #d8cbaa;border-radius:9px;overflow:hidden;box-shadow:0 1px 0 rgba(70,55,20,.03)}.formal-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e7dcc1;background:linear-gradient(180deg,#fffdf8,#fbf6e9)}.formal-symbol{width:28px;height:28px;border:1px solid #ccb982;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-style:italic;font-size:16px;color:#745e23;background:#fff}.formal-title{font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:700;color:#4f442d;letter-spacing:.01em}.formal-subtitle{font-size:11px;color:#8b7c5b;margin-top:1px}.formal-body{padding:14px 18px 15px;font-family:Georgia,"Times New Roman",serif;color:#26231d}.formal-body p{margin:8px 0;line-height:1.6}.formal-body .formula{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-size:19px;font-weight:400;line-height:1.6;text-align:center;background:transparent;border:0;border-radius:0;padding:8px 10px;margin:7px auto;overflow:visible;color:#111;letter-spacing:.005em}.formal-body .formula.big{font-size:20px}.formal-body math{font-family:math,"STIX Two Math","Cambria Math","Latin Modern Math",serif;font-size:1.24rem;color:#111;margin:.65rem auto;display:block}.formal-body math[display="block"]{text-align:center}.formal-body mtext{font-family:Georgia,"Times New Roman",ser .place-grid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.place-card{min-width:100px;border:1px solid #d6dadd;border-radius:8px;padding:10px;background:#fff;text-align:center}.place-card .top{font-size:11px;color:#777}.place-card .mid{font:700 24px/1 Consolas,monospace;margin:5px 0}.place-card .bot{font-size:12px;color:#555}

.group-block{display:inline-flex;gap:3px;padding:5px 7px;border:1px solid #cfd6dc;border-radius:8px;background:#fff}.group-block.pad{background:#f9f1ec;border-color:#e2cbb9}.group-label{min-width:30px;text-align:center;font:700 15px Consolas,monospace}
.bit-cell{width:48px;height:58px;border:1px solid #bcc4cc;border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}.bit-cell .p{font-size:11px;color:#777}.bit-cell .v{font:700 22px/1 Consolas,monospace}.bit-cell.on{background:#1f2933;color:#fff;border-color:#1f2933}.bit-cell.on .p{color:#d6dde5}
.combo-card{border:1px solid #d6dadd;border-radius:8px;background:#fff;padding:10px;min-width:115px}.combo-card .cap{font-size:11px;color:#777}.combo-card .num{font:700 22px/1.1 Consolas,monospace;margin-top:4px}.combo-card .sub{font-size:12px;color:#555;margin-top:4px}
.range-bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.range-track{height:14px;background:#eef2f5;border-radius:999px;position:relative;overflow:hidden}.range-fill{height:100%;background:#244f72}.range-label{font:700 13px Consolas,monospace}
.stair-step{border:1px solid #d6dadd;border-radius:8px;background:#fff;padding:8px 10px;text-align:center;min-width:86px}.stair-step.active{background:#eef4f8;border-color:#9fc0d8}.stair-step small{display:block;color:#777;font-size:11px}.stair-step b{font:700 16px Consolas,monospace}
.flow-card{border:1px solid #d6dadd;border-radius:8px;background:#fff;padding:10px 12px;min-width:120px}.flow-card .f1{font-size:11px;color:#777}.flow-card .f2{font:700 16px/1.2 Consolas,monospace;margin-top:4px}.flow-arrow{color:#7b8794;font-size:22px}
.fast-rule{border:2px solid var(--accent);background:#f6fbff;border-radius:10px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 0 rgba(36,79,114,.06)}
.fast-rule-title{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:850;margin-bottom:7px}.fast-rule strong{color:#173d5b}
.fast-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.fast-map-card{border:1px solid #c8d9e5;background:#fff;border-radius:8px;padding:10px;text-align:center}.fast-map-card .base{font:800 21px Consolas,monospace}.fast-map-card .bits{font-size:12px;color:#56636f;margin-top:3px}
.no-dec{display:inline-block;border-radius:999px;background:#173d5b;color:#fff;padding:4px 9px;font-size:11px;font-weight:800;letter-spacing:.04em}.quick-converter{border:1px solid #c8d9e5;background:#fff;border-radius:9px;padding:13px;margin-top:12px}.quick-path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}.quick-path-box{border:1px solid #d4dde4;border-radius:8px;padding:8px 10px;background:#fff;text-align:center;min-width:110px}.quick-path-box b{display:block;font:800 16px Consolas,monospace;margin-top:2px}.quick-path-arrow{font-size:21px;color:#71808d}.quick-bits{font:700 15px Consolas,monospace;letter-spacing:1px}.quick-emph{background:#eef6fb;border:1px solid #bdd2e1;border-radius:7px;padding:8px 10px;margin-top:8px}

@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.main{padding:22px 18px 60px}.grid2,.grid3,.kc-grid,.compare{grid-template-columns:1fr}.row{display:block}.row>div{margin-bottom:8px}.range-bar{grid-template-columns:1fr}.repr-eq,.flow-arrow{display:none}}

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">ASC · Lab 2</div>
  <div class="brand-sub">Sisteme de numerație și reprezentarea valorilor · 3 ore</div>
  <a class="hub-link" href="../index.html">← Pagina centrală ASC</a>
  <div class="map">
    <div class="map-step" id="map0"><span class="mnode">I</span><span>Formalizăm reprezentarea</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map1"><span class="mnode">II</span><span>Schimbăm baza</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map2"><span class="mnode">III</span><span>Măsurăm spațiul</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map3"><span class="mnode">IV</span><span>Proiectăm reprezentarea</span></div>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div id="nav"></div>
  <div class="side-actions">
    <button onclick="exportReport()">Export raport HTML</button>
    <button onclick="exportJSON()">Export dovezi JSON</button>
    <button onclick="resetAll()">Resetare progres</button>
  </div>
</aside>

<main class="main">
  <header class="head">
    <div class="eyebrow" id="chapterLabel"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>
  <div id="stage"></div>
  <div class="nav-bottom">
    <button id="prevBtn" onclick="go(current-1)">← Înapoi</button>
    <button class="primary" id="nextBtn" onclick="finishAndNext()">Marchează rezolvat și continuă →</button>
  </div>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const chapters=[
 {name:"I. Formalizăm reprezentarea",from:0,to:2,map:0},
 {name:"II. Schimbăm reprezentarea",from:3,to:7,map:1},
 {name:"III. Măsurăm spațiul de reprezentare",from:8,to:11,map:2},
 {name:"IV. Proiectăm o reprezentare",from:12,to:12,map:3}
];
let current=0,evidence={},completed={};
try{evidence=JSON.parse(localStorage.getItem("asc_lab2_ev")||"{}");completed=JSON.parse(localStorage.getItem("asc_lab2_done")||"{}")}catch(e){}
function persist(){try{localStorage.setItem("asc_lab2_ev",JSON.stringify(evidence));localStorage.setItem("asc_lab2_done",JSON.stringify(completed))}catch(e){}}
function save(id,obj){evidence[id]={...(evidence[id]||{}),...obj,updated:new Date().toISOString()};persist();renderProof(id)}
function saveConclusion(id,v){save(id,{conclusion:v})}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function chapterOf(i){return chapters.find(c=>i>=c.from&&i<=c.to)}
function mission(id,items){return `<div class="panel"><div class="panel-title">Misiunea ta</div><div class="mission"><ol>${items.map(x=>`<li>${x}</li>`).join("")}</ol></div></div>`}
function proofPanel(id){return `<div class="panel soft"><div class="panel-title">Dovada produsă</div><div class="proof" id="${id}_proof">Încă nu ai produs o dovadă pentru această aplicație.</div></div>`}
function conclusionPanel(id,prompt){return `<div class="panel"><div class="panel-title">Concluzie scurtă</div><p>${prompt}</p><textarea id="${id}_conclusion" oninput="saveConclusion('${id}',this.value)" placeholder="1–3 propoziții...">${esc(evidence[id]?.conclusion||"")}</textarea></div>`}
function renderProof(id){const el=$(id+"_proof");if(!el)return;const e=evidence[id];if(!e){el.textContent="Încă nu ai produs o dovadă pentru această aplicație.";return}const lines=[];if(e.score!==undefined)lines.push(`Scor: ${e.score}/${e.total}`);if(e.attempts!==undefined)lines.push(`Încercări: ${e.attempts}`);if(e.artifact)lines.push(`Artefact: ${e.artifact}`);if(e.summary)lines.push(e.summary);el.textContent=lines.join("\n")||"Dovadă salvată."}
function gradeSimple(id,answers,normalizer=(x)=>x.trim().toLowerCase()){let c=0,vals=[];answers.forEach((a,i)=>{const v=$(`${id}_a_${i}`).value;const ok=normalizer(v)===normalizer(a);vals.push(v);const st=$(`${id}_s_${i}`);st.textContent=ok?"✓":"✗";st.className="status "+(ok?"goodtxt":"badtxt");if(ok)c++});const att=(evidence[id]?.attempts||0)+1;save(id,{score:c,total:answers.length,attempts:att,answers:vals});$(`${id}_score`).innerHTML=`<strong>${c}/${answers.length}</strong> corecte`}
function tableTool(id,rows,buttonLabel,handler){return `<div class="panel"><div class="panel-title">Proba practică</div><table class="exercise-table"><tr><th>#</th><th>Cerință</th><th>Răspuns</th><th></th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r}</td><td><input id="${id}_a_${i}"></td><td id="${id}_s_${i}" class="status">—</td></tr>`).join("")}</table><button class="primary" onclick="${handler}()">${buttonLabel}</button><div id="${id}_score" class="score">Nicio verificare încă.</div></div>`}
function kc(natural,comparison,formal,limit){return `<div class="kc"><div class="kc-title">Knowledge Core</div><div class="kc-grid"><div class="kc-part"><b>În limbaj natural</b><p>${natural}</p></div><div class="kc-part"><b>Comparație / intuiție</b><p>${comparison}</p></div></div><div class="kc-formal"><div class="formal-head"><div class="formal-symbol">ƒ</div><div><div class="formal-title">Formalizare matematică</div><div class="formal-subtitle">Definiția, relația sau proprietatea în formă riguroasă</div></div></div><div class="formal-body">${formal}</div></div>${limit?`<div class="kc-note"><b>Condiții / limită:</b> ${limit}</div>`:""}</div>`}
function normNum(x){return x.trim().toUpperCase().replace(/\s+/g,"").replace(/^0X/,"")}
const DIG="0123456789ABCDEF";
function digitVal(c){return DIG.indexOf(c.toUpperCase())}
function validNumeral(s,b){s=normNum(s);if(!s)return false;return [...s].every(ch=>digitVal(ch)>=0&&digitVal(ch)<b)}
function fromBase(s,b){s=normNum(s);if(!validNumeral(s,b))return NaN;let v=0;for(const ch of s)v=v*b+digitVal(ch);return v}
function toBase(n,b){n=Math.floor(Number(n));if(!Number.isFinite(n)||n<0||b<2||b>16)return "";if(n===0)return "0";let s="";while(n>0){s=DIG[n%b]+s;n=Math.floor(n/b)}return s}

function buildNav(){let h="";chapters.forEach(ch=>{h+=`<div class="chapter">${ch.name}</div>`;for(let i=ch.from;i<=ch.to;i++)h+=`<button id="nav${i}" class="navbtn" onclick="go(${i})"><span class="dot">${i+1}</span><span>${steps[i].name}</span></button>`});$("nav").innerHTML=h}
function go(i){if(i<0||i>=steps.length)return;current=i;const s=steps[i],ch=chapterOf(i);$("chapterLabel").innerHTML=`${ch.name} <span class="timebox">${s.time}</span>`;$("title").textContent=`${i+1}. ${s.name}`;$("lead").textContent=s.lead;$("stage").innerHTML=s.render();document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));$("nav"+i).classList.add("active");$("prevBtn").disabled=i===0;$("nextBtn").textContent=i===steps.length-1?"Finalizează":"Marchează rezolvat și continuă →";if(s.init)s.init();renderProof(s.id);updateProgress();window.scrollTo({top:0,behavior:"smooth"})}
function finishAndNext(){completed[steps[current].id]=true;persist();updateProgress();if(current<steps.length-1)go(current+1)}
function updateProgress(){let count=0;steps.forEach((s,i)=>{const d=!!completed[s.id];if(d)count++;const n=$("nav"+i);if(n)n.classList.toggle("done",d)});$("bar").style.width=`${count/steps.length*100}%`;$("progressText").textContent=`${count} / ${steps.length} aplicații marcate rezolvate`;const activeMap=chapterOf(current).map;for(let m=0;m<4;m++){const el=$("map"+m);el.classList.toggle("active",m===activeMap);const ch=chapters[m];const done=steps.slice(ch.from,ch.to+1).every(s=>completed[s.id]);el.classList.toggle("complete",done)}}
