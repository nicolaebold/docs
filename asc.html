<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASC Lab 1 — De la informație la calculator</title>
<style>
:root{
  --bg:#fff; --text:#171717; --muted:#68707a; --line:#dde1e5; --soft:#f7f8f9;
  --accent:#244f72; --accentSoft:#eef4f8; --good:#2e6a43; --bad:#a03b3b; --warn:#80651d;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.52}
button,input,select,textarea{font:inherit}
button{border:1px solid #cbd0d5;background:#fff;color:#222;border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{background:#f4f5f6}
button.primary{border-color:var(--accent);color:var(--accent)}
button.good{border-color:var(--good);color:var(--good)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{width:100%;border:1px solid #cbd0d5;border-radius:5px;padding:8px;background:#fff;color:#111}
textarea{min-height:92px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.app{display:grid;grid-template-columns:292px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:18px 14px;background:#fff}
.brand{font-weight:750;font-size:17px}.brand-sub{font-size:12px;color:#777;margin:3px 0 12px}
.map{border:1px solid var(--line);border-radius:7px;padding:9px;margin-bottom:12px;background:#fafafa}
.map-step{display:flex;align-items:center;gap:7px;font-size:11px;color:#777;padding:4px 0}
.map-step .mnode{width:17px;height:17px;border:1px solid #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px}
.map-step.active{color:var(--accent);font-weight:700}.map-step.active .mnode{border-color:var(--accent)}
.map-step.complete .mnode{background:#777;color:#fff}
.map-arrow{margin-left:8px;color:#aaa;font-size:10px}
.progress{height:5px;background:#eee;border-radius:9px;overflow:hidden}.progress>div{height:100%;width:0;background:#777}
.progress-text{font-size:11px;color:#777;margin:5px 0 12px}
.chapter{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#888;margin:14px 0 5px}
.navbtn{display:flex;gap:7px;width:100%;border:0;background:#fff;text-align:left;padding:6px 7px;border-radius:4px;font-size:12px}
.navbtn:hover{background:#f6f6f6}.navbtn.active{background:var(--accentSoft);color:var(--accent)}
.navbtn.done .dot{background:#777;color:#fff}
.dot{flex:0 0 19px;height:19px;border:1px solid #bbb;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;margin-top:1px}
.side-actions{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:13px;margin-top:18px}
.main{max-width:1120px;width:100%;margin:0 auto;padding:30px 40px 80px}
.head{border-bottom:1px solid var(--line);padding-bottom:17px;margin-bottom:20px}
.eyebrow{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;font-weight:750}
h1{font-size:26px;line-height:1.22;margin:5px 0 7px}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0 0 7px}
.lead{margin:0;color:#555;max-width:900px}
.storyline{border-left:3px solid #c8cdd2;padding:8px 13px;color:#46505a;margin:0 0 14px}
.panel{border:1px solid var(--line);border-radius:7px;padding:15px 16px;margin:12px 0;background:#fff}
.panel.soft{background:var(--soft)}.panel.accent{background:var(--accentSoft);border-color:#d8e5ed}
.panel-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:#67717b;font-weight:750;margin-bottom:8px}
.mission{font-size:15px}.mission ol{margin:7px 0 0 20px}.mission li{margin:5px 0}
.formula{font:14px Consolas,"SFMono-Regular",monospace;background:#fafafa;border:1px solid #e4e7ea;border-radius:5px;padding:9px 10px;margin:9px 0;overflow:auto}
.small{font-size:12px;color:#666}.tiny{font-size:11px;color:#777}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:9px;align-items:end}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.result{white-space:pre-wrap;background:#fafafa;border:1px solid #e0e3e5;border-radius:5px;padding:10px;margin-top:9px;min-height:42px;overflow-wrap:anywhere}
.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}
.proof{background:#fafafa;border:1px solid #e0e3e5;border-radius:5px;padding:10px;min-height:42px;white-space:pre-wrap}
.nav-bottom{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:18px;margin-top:24px}
.explain-note{font-size:13px;color:#4f5963;margin-top:8px}
.object-bin{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:10px 0;min-height:60px}
.obj{width:20px;height:20px;border:1px solid #7f8890;border-radius:50%;background:#fff}
.group{display:inline-flex;gap:2px;flex-wrap:wrap;border:1px solid #bfc6cc;padding:5px;border-radius:5px;margin:3px}
.place-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.place{min-width:115px;border:1px solid #d6dadd;border-radius:6px;padding:9px;text-align:center;background:#fff}
.place .power{font-size:11px;color:#777}.place .digit{font-size:26px;font-weight:750}.place .meaning{font-size:12px;color:#555}
.roman-bank{display:flex;gap:7px;flex-wrap:wrap}.roman-token{border:1px solid #bbb;border-radius:5px;padding:7px 10px;cursor:pointer;background:#fff}
.binary-switches{display:flex;gap:8px;flex-wrap:wrap}.bit-switch{width:48px;height:48px;border:1px solid #bbb;border-radius:6px;display:flex;align-items:center;justify-content:center;font:20px Consolas,monospace;cursor:pointer;background:#fff}.bit-switch.on{background:#222;color:#fff}
.ascii-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:300px;overflow:auto}.ascii-cell{border:1px solid #ddd;border-radius:3px;padding:5px;text-align:center;font-size:11px;cursor:pointer}.ascii-cell:hover{background:#f3f3f3}.ascii-cell b{display:block;font-size:15px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice-card{border:1px solid #ccd2d8;border-radius:7px;padding:12px;cursor:pointer;background:#fff}.choice-card.selected{outline:2px solid var(--accent);background:var(--accentSoft)}
.pixel-wrap{overflow:auto;border:1px solid #ddd;background:#fff;padding:10px}.pixel-grid{display:grid;gap:1px;width:max-content;background:#ddd;border:1px solid #ddd}.pixel{width:25px;height:25px;background:#fff;cursor:pointer}
.level-strip{display:flex;gap:2px;height:70px}.level-strip span{flex:1;border:1px solid #ddd}
.swatch{height:90px;border:1px solid #ddd;border-radius:6px}
.meter{height:18px;border:1px solid #ccd2d8;border-radius:999px;overflow:hidden;background:#f4f4f4}.meter>div{height:100%;width:0;background:#777}
.need-bank{display:flex;gap:8px;flex-wrap:wrap}.need-card{border:1px solid #bbb;border-radius:5px;padding:8px 10px;cursor:pointer;background:#fff}.need-card.chosen{background:var(--accentSoft);border-color:var(--accent)}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:center}.flow-box{border:1px solid #ccd2d8;border-radius:6px;padding:14px;text-align:center;min-height:72px;background:#fff}.flow-arrow{text-align:center;color:#777;font-size:12px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.exercise-table{width:100%;border-collapse:collapse;font-size:13px}.exercise-table th,.exercise-table td{border:1px solid #ddd;padding:7px;text-align:left;vertical-align:middle}.exercise-table th{background:#fafafa}.exercise-table input,.exercise-table select{padding:5px}
.score{border:1px solid #ddd;background:#fafafa;border-radius:5px;padding:9px;margin-top:9px}.score strong{font-size:18px}
.spec-card{border:1px solid #ddd;border-radius:6px;padding:12px}.spec-card b{display:block;margin-bottom:4px}
.pulse{height:48px;border:1px solid #ddd;border-radius:5px;position:relative;overflow:hidden;background:linear-gradient(to bottom,#fff,#fafafa)}.pulse-dot{position:absolute;top:17px;width:12px;height:12px;border-radius:50%;background:#444;left:0}

.compare-grids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.compare-card{border:1px solid #d9dde1;border-radius:7px;padding:10px;background:#fff}
.compare-card h3{margin-bottom:4px}
.mini-pixel-grid{display:grid;gap:1px;width:max-content;background:#ddd;border:1px solid #ddd;margin:8px auto}
.mini-pixel{width:16px;height:16px;background:#fff}
.mode-grid{display:grid;gap:1px;width:max-content;background:#ddd;border:1px solid #ddd;margin:8px auto}
.mode-pixel{width:26px;height:26px;cursor:pointer}
.memory-grid{display:grid;grid-template-columns:repeat(8,minmax(70px,1fr));gap:6px}
.memory-cell{border:1px solid #d8dde1;border-radius:5px;padding:6px;background:#fff}
.memory-cell .address{font:10px Consolas,monospace;color:#777}
.memory-cell input{padding:5px;margin-top:3px}
.calc-path{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center}
.calc-node{border:1px solid #ccd2d8;border-radius:6px;padding:12px;text-align:center;background:#fff}
.calc-arrow{color:#777;text-align:center}
.encoding-levels{display:grid;grid-template-columns:1fr;gap:8px}
.encoding-level{border:1px solid #d8dde1;border-radius:6px;padding:10px;background:#fff}
.encoding-level .tag{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#777;font-weight:700}
.binary-word{font:18px Consolas,monospace;letter-spacing:2px}
.schema-board{display:grid;grid-template-columns:repeat(3,1fr);grid-template-areas:"input control output" "storage processing inter";gap:12px;margin-top:10px}
.schema-slot{min-height:100px;border:2px dashed #c4cbd1;border-radius:7px;padding:10px;text-align:center;background:#fafafa;cursor:pointer}
.schema-slot.filled{border-style:solid;border-color:#8d9aa5;background:#fff}
.schema-slot[data-slot="input"]{grid-area:input}.schema-slot[data-slot="control"]{grid-area:control}.schema-slot[data-slot="output"]{grid-area:output}
.schema-slot[data-slot="storage"]{grid-area:storage}.schema-slot[data-slot="processing"]{grid-area:processing}.schema-slot[data-slot="interconnection"]{grid-area:inter}
.schema-bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.schema-token{border:1px solid #bbb;border-radius:5px;padding:7px 9px;background:#fff;cursor:pointer}
.schema-token.selected{outline:2px solid var(--accent);background:var(--accentSoft)}
.clock-window{position:relative;height:82px;border:1px solid #d8dde1;border-radius:6px;background:#fff;margin:10px 0;overflow:hidden}
.clock-axis{position:absolute;left:10px;right:10px;bottom:18px;border-top:1px solid #aaa}
.clock-tick{position:absolute;bottom:18px;width:2px;height:42px;background:#333}
.clock-label{position:absolute;bottom:0;font-size:10px;color:#777}
.capacity-box{height:125px;border:2px solid #9ca7af;border-radius:7px;position:relative;overflow:hidden;background:#fff}
.capacity-fill{position:absolute;left:0;right:0;bottom:0;background:#dfe6eb}
.pipe{height:24px;border:1px solid #aeb7bf;border-radius:999px;background:#f4f5f6;overflow:hidden}
.pipe-flow{height:100%;background:#cfd9e0;width:0}
.spec-lab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:900px){.compare-grids,.spec-lab{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(4,1fr)}.calc-path{grid-template-columns:1fr}.schema-board{grid-template-columns:1fr;grid-template-areas:"input" "storage" "processing" "control" "output" "inter"}}

@media(max-width:900px){
 .app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 .main{padding:22px 18px 60px}.grid2,.grid3,.choice-grid,.flow,.match-grid{grid-template-columns:1fr}.row{display:block}.row>div{margin-bottom:8px}.ascii-grid{grid-template-columns:repeat(4,1fr)}
}
@media print{.sidebar,.nav-bottom,button{display:none!important}.app{display:block}.main{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">ASC · Lab 1</div>
  <div class="brand-sub">De la informație la calculator</div>

  <div class="map">
    <div class="map-step" id="map0"><span class="mnode">1</span><span>Reprezentare</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map1"><span class="mnode">2</span><span>Costul informației</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map2"><span class="mnode">3</span><span>Nevoile mașinii</span></div>
    <div class="map-arrow">↓</div>
    <div class="map-step" id="map3"><span class="mnode">4</span><span>Calculatorul real</span></div>
  </div>

  <div class="progress"><div id="bar"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div id="nav"></div>

  <div class="side-actions">
    <button onclick="exportReport()">Export raport HTML</button>
    <button onclick="exportJSON()">Export dovezi JSON</button>
    <button onclick="resetAll()">Resetare progres</button>
  </div>
</aside>

<main class="main">
  <header class="head">
    <div class="eyebrow" id="chapterLabel"></div>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>

  <div id="stage"></div>

  <div class="nav-bottom">
    <button id="prevBtn" onclick="go(current-1)">← Înapoi</button>
    <button class="primary" id="nextBtn" onclick="finishAndNext()">Marchează rezolvat și continuă →</button>
  </div>
</main>
</div>

<script>
const $ = id => document.getElementById(id);
const chapters = [
  {name:"I. Reprezentarea informației", from:0, to:6, map:0},
  {name:"II. Imaginea ca aplicație-umbrelă", from:7, to:11, map:1},
  {name:"III. De la informație la un sistem de calcul", from:12, to:16, map:2},
  {name:"IV. Calculatorul real", from:17, to:18, map:3}
];

let current = 0;
let evidence = {};
let completed = {};
try{
  evidence = JSON.parse(localStorage.getItem("asc_lab1_story_ev") || "{}");
  completed = JSON.parse(localStorage.getItem("asc_lab1_story_done") || "{}");
}catch(e){}

function persist(){
  try{
    localStorage.setItem("asc_lab1_story_ev", JSON.stringify(evidence));
    localStorage.setItem("asc_lab1_story_done", JSON.stringify(completed));
  }catch(e){}
}
function save(id,obj){ evidence[id] = {...(evidence[id]||{}), ...obj, updated:new Date().toISOString()}; persist(); renderProof(id); }
function saveConclusion(id,v){ save(id,{conclusion:v}); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function chapterOf(i){ return chapters.find(c=>i>=c.from && i<=c.to); }
function mission(id,items){
  return `<div class="panel"><div class="panel-title">Misiunea ta</div><div class="mission"><ol>${items.map(x=>`<li>${x}</li>`).join("")}</ol></div></div>`;
}
function proofPanel(id){
  return `<div class="panel soft"><div class="panel-title">Dovada produsă</div><div class="proof" id="${id}_proof">Încă nu ai produs o dovadă pentru această aplicație.</div></div>`;
}
function conclusionPanel(id,prompt){
  return `<div class="panel"><div class="panel-title">Concluzie scurtă</div><p>${prompt}</p><textarea id="${id}_conclusion" oninput="saveConclusion('${id}',this.value)" placeholder="1–3 propoziții...">${esc(evidence[id]?.conclusion||"")}</textarea></div>`;
}
function renderProof(id){
  const el=$(id+"_proof"); if(!el)return;
  const e=evidence[id]; if(!e){el.textContent="Încă nu ai produs o dovadă pentru această aplicație.";return;}
  const lines=[];
  if(e.score!==undefined) lines.push(`Scor: ${e.score}/${e.total}`);
  if(e.attempts!==undefined) lines.push(`Încercări: ${e.attempts}`);
  if(e.artifact) lines.push(`Artefact: ${e.artifact}`);
  if(e.summary) lines.push(e.summary);
  el.textContent=lines.join("\n") || "Dovadă salvată.";
}
function gradeSimple(id,answers,normalizer=(x)=>x.trim().toLowerCase()){
  let c=0,vals=[];
  answers.forEach((a,i)=>{
    const v=$(`${id}_a_${i}`).value;
    const ok=normalizer(v)===normalizer(a);
    vals.push(v);
    const st=$(`${id}_s_${i}`); st.textContent=ok?"✓":"✗"; st.className="status "+(ok?"goodtxt":"badtxt");
    if(ok)c++;
  });
  const att=(evidence[id]?.attempts||0)+1;
  save(id,{score:c,total:answers.length,attempts:att,answers:vals});
  $(`${id}_score`).innerHTML=`<strong>${c}/${answers.length}</strong> corecte`;
}
function tableTool(id,rows,buttonLabel,handler){
  return `<div class="panel"><div class="panel-title">Proba practică</div><table class="exercise-table">
    <tr><th>#</th><th>Cerință</th><th>Răspuns</th><th></th></tr>
    ${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r}</td><td><input id="${id}_a_${i}"></td><td id="${id}_s_${i}" class="status">—</td></tr>`).join("")}
  </table><button class="primary" onclick="${handler}()">${buttonLabel}</button><div id="${id}_score" class="score">Nicio verificare încă.</div></div>`;
}

// ---------- state ----------
let decObjects=27;
let sexObjects=125;
let binaryBits=[0,0,0];
let romanBuilt="";
let pixelData=Array.from({length:8},()=>Array(8).fill(0));
let machineNeeds=new Set();
let freqTimer=null;

// ---------- steps ----------
const steps = [
{
 id:"decimal",
 name:"De ce funcționează baza 10?",
 lead:"Pornești de la o idee familiară: grupezi unitățile câte 10 și descoperi de ce pozițiile cifrelor contează.",
 render(){
   return `
   <div class="storyline"><b>Întrebarea:</b> dacă ai multe obiecte de numărat, cum le organizezi ca să nu scrii un șir interminabil de unități?</div>
   <div class="panel accent">
     <div class="panel-title">Explicație prin acțiune</div>
     <h3>Grupează obiectele câte 10</h3>
     <p>Ai <b id="decCount">${decObjects}</b> obiecte. Schimbă numărul, apoi apasă „Grupează”.</p>
     <div class="row"><div class="c8"><input id="decRange" type="range" min="1" max="99" value="${decObjects}" oninput="decObjects=+this.value;updateDecimal()"></div><div class="c4"><button onclick="groupDecimal()">Grupează câte 10</button></div></div>
     <div id="decObjects" class="object-bin"></div>
     <div id="decGroups" class="result">Încă nu ai grupat.</div>
   </div>
   <div class="panel">
     <div class="panel-title">De la grupare la poziție</div>
     <div class="place-row"><div class="place"><div class="power">10¹</div><div class="digit" id="decTens">2</div><div class="meaning">zeci</div></div><div class="place"><div class="power">10⁰</div><div class="digit" id="decUnits">7</div><div class="meaning">unități</div></div></div>
     <div id="decFormula" class="formula">27 = 2·10 + 7</div>
   </div>
   ${mission("decimal",["Modifică numărul de obiecte de cel puțin trei ori și grupează-le câte 10.","Observă cum numărul de zeci și unități se modifică.","Rezolvă cele 5 cerințe scurte."])}
   ${tableTool("decimal",["47 = ? zeci și 7 unități","3 zeci + 5 unități = ?","În 82, valoarea cifrei 8 este?","10 unități formează câte zeci?","4·10²+2·10+6 = ?"],"Verifică","checkDecimal")}
   ${proofPanel("decimal")}
   ${conclusionPanel("decimal","Ce înseamnă, în propriile cuvinte, că sistemul zecimal este pozițional?")}`;
 },
 init(){ updateDecimal(); }
},
{
 id:"sexagesimal",
 name:"Ce se schimbă dacă grupăm câte 60?",
 lead:"Păstrezi același mecanism, dar schimbi pragul de grupare. Așa devine inteligibil sistemul sexagesimal.",
 render(){
   return `
   <div class="storyline"><b>Legătura:</b> la baza 10 ai grupat câte 10. Acum păstrăm exact ideea de grupare, dar schimbăm regula.</div>
   <div class="panel accent"><div class="panel-title">Explicație prin acțiune</div>
     <h3>Grupează unitățile câte 60</h3>
     <div class="row"><div class="c8"><input id="sexRange" type="range" min="1" max="240" value="${sexObjects}" oninput="sexObjects=+this.value;updateSexObjects()"></div><div class="c4"><button onclick="groupSex()">Grupează câte 60</button></div></div>
     <div id="sexVisual" class="object-bin"></div><div id="sexGroupOut" class="result">Încă nu ai grupat.</div>
     <p class="explain-note">În baza 60, o poziție poate conține 0…59. La 60 faci transport către poziția următoare.</p>
   </div>
   <div class="panel"><div class="formula">(2,5)₆₀ = 2·60 + 5 = 125₁₀</div><p>Este aceeași idee ca 25₁₀ = 2·10 + 5; s-a schimbat doar baza.</p></div>

// ---------- navigation ----------
function buildNav(){
  let h="";
  chapters.forEach(ch=>{
    h+=`<div class="chapter">${ch.name}</div>`;
    for(let i=ch.from;i<=ch.to;i++){
      h+=`<button id="nav${i}" class="navbtn" onclick="go(${i})"><span class="dot">${i+1}</span><span>${steps[i].name}</span></button>`;
    }
  });
  $("nav").innerHTML=h;
}
function go(i){
  if(i<0||i>=steps.length)return;
  if(freqTimer){clearInterval(freqTimer);freqTimer=null;}
  current=i;
  const s=steps[i], ch=chapterOf(i);
  $("chapterLabel").textContent=ch.name;
  $("title").textContent=`${i+1}. ${s.name}`;
  $("lead").textContent=s.lead;
  $("stage").innerHTML=s.render();
  document.querySelectorAll(".navbtn").forEach(x=>x.classList.remove("active"));
  $("nav"+i).classList.add("active");
  $("prevBtn").disabled=i===0;
  $("nextBtn").textContent=i===steps.length-1?"Finalizează":"Marchează rezolvat și continuă →";
  if(s.init)s.init();
  renderProof(s.id);
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
}
function finishAndNext(){
  completed[steps[current].id]=true;
  persist(); updateProgress();
  if(current<steps.length-1)go(current+1);
}
function updateProgress(){
  let count=0;
  steps.forEach((s,i)=>{
    const d=!!completed[s.id]; if(d)count++;
    const n=$("nav"+i); if(n)n.classList.toggle("done",d);
  });
  $("bar").style.width=`${count/steps.length*100}%`;
  $("progressText").textContent=`${count} / ${steps.length} aplicații marcate rezolvate`;
  const activeMap=chapterOf(current).map;
  for(let m=0;m<4;m++){
    const el=$("map"+m); el.classList.toggle("active",m===activeMap);
    const chapterDone=chapters[m] ? steps.slice(chapters[m].from,chapters[m].to+1).every(s=>completed[s.id]) : false;
    el.classList.toggle("complete",chapterDone);
  }
}

    const left=Math.abs(nx-(0.22+0.28*(1-ny)))<0.12;
    const right=Math.abs(nx-(0.78-0.28*(1-ny)))<0.12;
    const bar=ny>0.48&&ny<0.62&&nx>0.32&&nx<0.68;
    return left||right||bar;
  }
  const dx=nx-.5,dy=ny-.5,r=Math.sqrt(dx*dx+dy*dy);
  return (r>.25&&r<.42)||(Math.abs(dx)<.08&&ny>.45);
}
function fillMiniGridV5(id,n){
  const g=$(id); if(!g)return; g.innerHTML=""; g.style.gridTemplateColumns=`repeat(${n},${n<=4?28:n<=8?20:12}px)`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const d=document.createElement("div");d.className="mini-pixel";d.style.width=d.style.height=n<=4?"28px":n<=8?"20px":"12px";d.style.background=shapeValueV5(n,x,y,resolutionShapeV5)?"#222":"#fff";g.appendChild(d);}
}
function drawResolutionComparison(){
  fillMiniGridV5("res4",4);fillMiniGridV5("res8",8);fillMiniGridV5("res16",16);
  if($("resCompareInfo"))$("resCompareInfo").textContent="Toate cele trei grile descriu aceeași formă. Diferența este numărul de poziții disponibile pentru a reda conturul.";
}
function toggleResolutionShape(){resolutionShapeV5^=1;drawResolutionComparison();}
function checkResolution(){gradeSimple("imageResolution",["16","64","4"],x=>x.trim());}

function sourceColorV5(x,y){
  const r=Math.round(40+x/7*200), g=Math.round(40+y/7*180), b=Math.round(220-(x+y)/14*160);
  return [r,g,b];
}
function quantGrayV5(gray,levels){
  if(levels<=1)return 0;
  const idx=Math.round(gray/255*(levels-1));
  return Math.round(idx/(levels-1)*255);
}
function drawModeGridV5(id,mode){
  const g=$(id);if(!g)return;g.innerHTML="";g.style.gridTemplateColumns="repeat(8,26px)";
  const levels=+$("grayLevels").value;
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const [r,gc,b]=sourceColorV5(x,y);
    const gray=Math.round(.299*r+.587*gc+.114*b);
    const q=quantGrayV5(gray,levels);
    const bw=gray>=128?255:0;
    const d=document.createElement("div");d.className="mode-pixel";
    if(mode==="bw")d.style.background=`rgb(${bw},${bw},${bw})`;
    if(mode==="gray")d.style.background=`rgb(${q},${q},${q})`;
    if(mode==="color")d.style.background=`rgb(${r},${gc},${b})`;
    d.onclick=()=>showModeCellV5(x,y);
    g.appendChild(d);
  }
}
function drawModeGrids(){drawModeGridV5("bwGrid","bw");drawModeGridV5("grayGrid","gray");drawModeGridV5("colorGrid","color");}
function showModeCellV5(x,y){
  const [r,g,b]=sourceColorV5(x,y),gray=Math.round(.299*r+.587*g+.114*b),levels=+$("grayLevels").value,q=quantGrayV5(gray,levels),bw=gray>=128?255:0;
  $("modeCellInfo").textContent=`Poziția (${x},${y})\nAlb-negru: ${bw===255?1:0}\nGrayscale (${levels} niveluri): ${q}\nRGB: (${r},${g},${b})`;
}
function checkImageModes(){gradeSimple("imageModes",["64","128","512","192","1024"],x=>x.trim());}

let memoryV5=Array(16).fill(0);
function buildMemoryV5(){
  const g=$("memGridV5");if(!g)return;g.innerHTML="";
  memoryV5.forEach((v,i)=>{const d=document.createElement("div");d.className="memory-cell";d.innerHTML=`<div class="address">${i.toString(2).padStart(4,"0")} · ${i}</div><input type="number" min="0" max="255" value="${v}" onchange="memoryV5[${i}]=Math.max(0,Math.min(255,+this.value||0))">`;g.appendChild(d);});
}
function memoryOperationV5(){
  const op=$("memOpV5").value,a=$("memAddrV5").value.trim();if(!/^[01]{4}$/.test(a)){$("memOutV5").textContent="Adresa trebuie să aibă 4 biți.";return;}
  const idx=parseInt(a,2);
  if(op==="WRITE"){const v=Math.max(0,Math.min(255,+$("memValV5").value||0));memoryV5[idx]=v;buildMemoryV5();$("memOutV5").textContent=`WRITE: adresa ${a} (${idx}) ← valoarea ${v}`;}
  else $("memOutV5").textContent=`READ: adresa ${a} (${idx}) → valoarea ${memoryV5[idx]}`;
  save("memory",{artifact:"memorie 16×8 manipulată",lastOperation:op,address:a,value:memoryV5[idx]});
}
function checkMemoryV5(){gradeSimple("memory",["4","0101","1101","42","256"],x=>x.trim());}

function prepareProcessingV5(){memoryV5[2]=7;memoryV5[5]=12;memoryV5[7]=3;paintProcessingV5();}
function paintProcessingV5(){
  const a=Math.max(0,Math.min(15,+$("procAddrA").value||0)),b=Math.max(0,Math.min(15,+$("procAddrB").value||0));
  if($("procA"))$("procA").textContent=memoryV5[a];if($("procB"))$("procB").textContent=memoryV5[b];
}
function executeProcessingV5(){
  const a=+$("procAddrA").value,b=+$("procAddrB").value,d=+$("procDest").value,op=$("procOp").value;
  const x=memoryV5[a]||0,y=memoryV5[b]||0;let r=op==="ADD"?x+y:op==="SUB"?x-y:x*y;
  memoryV5[d]=r;if($("procR"))$("procR").textContent=r;
  $("procTrace").textContent=`READ M[${a}] → ${x}\nREAD M[${b}] → ${y}\n${op}(${x},${y}) → ${r}\nWRITE M[${d}] ← ${r}`;
  save("processing",{artifact:"traseu stocare → calcul → stocare",trace:$("procTrace").textContent,result:r,destination:d});
}

const schemaLabelsV5={
 input:"INTRARE",storage:"STOCARE",processing:"PRELUCRARE",control:"CONTROL",output:"IEȘIRE",interconnection:"INTERCONECTARE"
};
let selectedSchemaV5=null,placedSchemaV5={};
function initSchemaV5(){
  selectedSchemaV5=null;placedSchemaV5={};
  const bank=$("schemaBank");if(!bank)return;bank.innerHTML="";
  Object.entries(schemaLabelsV5).forEach(([k,label])=>{const b=document.createElement("div");b.className="schema-token";b.id="schemaToken_"+k;b.textContent=label;b.onclick=()=>{selectedSchemaV5=k;document.querySelectorAll(".schema-token").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");};bank.appendChild(b);});

function placeSchemaV5(slot){
  if(!selectedSchemaV5)return;
  placedSchemaV5[slot]=selectedSchemaV5;
  const el=document.querySelector(`.schema-slot[data-slot="${slot}"]`);el.classList.add("filled");el.querySelector("b").textContent=schemaLabelsV5[selectedSchemaV5];
  selectedSchemaV5=null;document.querySelectorAll(".schema-token").forEach(x=>x.classList.remove("selected"));
}
function validateSchemaV5(){
  let c=0;Object.keys(schemaLabelsV5).forEach(k=>{if(placedSchemaV5[k]===k)c++;});

function drawClockV5(){
  const hz=+$("freqHzV5").value,w=$("clockWindowV5");if(!w)return;
  w.querySelectorAll(".clock-tick,.clock-label").forEach(x=>x.remove());
  for(let i=0;i<hz;i++){const t=document.createElement("div");t.className="clock-tick";t.style.left=`${10+(i+.5)/hz*90}%`;w.appendChild(t);}
  const l0=document.createElement("span");l0.className="clock-label";l0.style.left="8px";l0.textContent="0 s";w.appendChild(l0);
  const l1=document.createElement("span");l1.className="clock-label";l1.style.right="8px";l1.textContent="1 s";w.appendChild(l1);
  $("clockTextV5").textContent=`În intervalul de 1 secundă vezi ${hz} cicluri. Asta înseamnă ${hz} Hz. 3,2 GHz înseamnă 3.200.000.000 cicluri în fiecare secundă.`;
}

function exportReport(){
